<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Clock</title>
    <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <h1>hello world</h1>
    <section class="countdown">
      <div id="days"><span class="value"></span><span class="label"></span></div>
      <div id="hours"><span class="value"></span><span class="label"></span></div>
      <div id="minutes"><span class="value"></span><span class="label"></span></div>
      <div id="seconds"><span class="value"></span><span class="label"></span></div>
    </section>
    <script src="js/main.js"></script>
  </body>
</html>
