<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Clock</title>
    <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <h1>hello world</h1>
    <section class="countdown">
      <div id="days"><span class="value"></span><span class="label"></span></div>
      <div id="hours"><span class="value"></span><span class="label"></span></div>
      <div id="minutes"><span class="value"></span><span class="label"></span></div>
      <div id="seconds"><span class="value"></span><span class="label"></span></div>
    </section>
    <div class="hidden" id="info-card">
      <p><strong>Parameters:</strong><br>title: Text to display<br>y, m, d: Year, Month, Day<br>hour, min, sec: Hour, Minute, Second</p>
      <p>Note: If you clear date fields and only use time, it generates a countdown from now.</p>
    </div>
    <button id="info-toggle">info</button>
    <script src="js/main.js"></script>
  </body>
</html>
